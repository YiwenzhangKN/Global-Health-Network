<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Network Analysis of Causes of Death Across Countries</title>
<style>
  :root {
    --bg: #ffffff; --pane: #f7f7f7; --border: #e1e1e1; --hover: #eef3fa; --active: #e1ebf7;
    --text: #242424; --text-2: #616161; --muted: #9a9a9a; --accent: #0f6cbd;
    --link: #c3c7cd; --protective: #0f6cbd; --harmful: #c50f1f; --indicator: #5f6b7a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--text);
         font: 13px/1.4 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
  button, input, select { font: inherit; color: inherit; }

  /* top bar */
  .topbar { min-height: 48px; flex: none; display: flex; align-items: center; gap: 16px; padding: 0 16px;
            border-bottom: 1px solid var(--border); }
  .brand { font-size: 15px; font-weight: 600; flex: none; white-space: nowrap; }
  #search { flex: 1 1 180px; max-width: 420px; height: 32px; padding: 0 10px; border: 1px solid var(--border); border-radius: 4px;
            background: var(--pane); }
  #search:focus { outline: none; border-color: var(--accent); background: var(--bg); }
  .switch { margin-left: auto; display: flex; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
  .switch button { border: 0; background: var(--bg); padding: 6px 14px; cursor: pointer; color: var(--text-2); }
  .switch button + button { border-left: 1px solid var(--border); }
  .switch button.on { background: var(--active); color: var(--accent); font-weight: 600; }
  .switch button:disabled { color: var(--muted); cursor: not-allowed; }
  @media (max-width: 700px) {
    .topbar { height: auto; flex-wrap: wrap; gap: 8px; padding: 8px 12px; }
    .brand { width: 100%; white-space: normal; }
    #search { flex: 1 1 100%; max-width: none; }
    .switch { width: 100%; margin-left: 0; }
    .switch button { flex: 1; padding: 6px 8px; white-space: nowrap; }
  }

  /* main area */
  .app { flex: 1; display: flex; min-height: 0; }
  nav { width: 260px; flex: none; background: var(--pane); border-right: 1px solid var(--border); overflow-y: auto; padding: 8px 0; }
  .nav-title { padding: 12px 16px 4px; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .nav-item { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 16px; border: 0; background: none;
              text-align: left; cursor: pointer; }
  .nav-item:hover { background: var(--hover); }
  .nav-item.on { background: var(--active); font-weight: 600; }
  .nav-item.off { color: var(--muted); }
  .nav-item.off .dot { opacity: .25; }
  .nav-item .count { margin-left: auto; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  @media (max-width: 700px) {
    .app { flex-direction: column; }
    nav { width: 100%; max-height: 38vh; border-right: 0; border-bottom: 1px solid var(--border); }
    .status { width: 100%; min-width: 0; overflow-x: auto; flex-wrap: nowrap; }
    .status span { flex: none; }
  }
  .filters { padding: 4px 16px 12px; display: grid; gap: 8px; }
  .filters label { display: flex; align-items: center; gap: 6px; color: var(--text-2); }
  .filters select, .filters input[type=range] { width: 100%; }
  .filters select { padding: 3px 4px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); }
  .filters .row { display: flex; justify-content: space-between; color: var(--text-2); }
  .small-btn { border: 1px solid var(--border); background: var(--bg); border-radius: 4px; padding: 4px 10px; cursor: pointer; }

  main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .toolbar { height: 40px; flex: none; display: flex; align-items: stretch; gap: 4px; padding: 0 12px;
             border-bottom: 1px solid var(--border); }
  .toolbar button { border: 0; background: none; padding: 0 12px; cursor: pointer; color: var(--text-2);
                    border-bottom: 2px solid transparent; }
  .toolbar button:hover { color: var(--text); }
  .toolbar button.on { color: var(--text); font-weight: 600; border-bottom-color: var(--accent); }
  .toolbar .count { color: var(--muted); font-weight: 400; margin-left: 4px; }
  .content { flex: 1; min-height: 0; display: flex; }
  .content[hidden] { display: none; }
  #view-report { display: none; flex: 1; }
  body.report-mode nav, body.report-mode .toolbar, body.report-mode .content, body.report-mode #search,
  body.report-mode .status { display: none; }
  body.report-mode #view-report { display: flex; }
  .view { flex: 1; min-width: 0; display: flex; }
  .view[hidden] { display: none; }
  #chart { flex: 1; min-width: 0; position: relative; }
  #chart svg { width: 100%; height: 100%; display: block; cursor: grab; }
  #details { width: 320px; flex: none; border-left: 1px solid var(--border); overflow-y: auto; padding: 16px; }
  #details h2 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
  #details .sub { color: var(--text-2); margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin-bottom: 14px; }
  .kv span:nth-child(odd) { color: var(--text-2); }
  .kv span:nth-child(even) { text-align: right; font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); }

  /* tables */
  .table-wrap { flex: 1; overflow: auto; }
  table { border-collapse: collapse; width: 100%; }
  th, td { padding: 5px 10px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
  th { position: sticky; top: 0; background: var(--bg); font-weight: 600; cursor: pointer; user-select: none; z-index: 1; }
  th:hover { background: var(--hover); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--hover); }
  #details table th { position: static; cursor: default; }
  #details td, #details th { padding: 4px 0; }
  #details td.num { padding-left: 8px; }

  #report-frame { flex: 1; border: 0; }

  .status { height: 26px; flex: none; display: flex; align-items: center; gap: 16px; padding: 0 16px;
            border-top: 1px solid var(--border); background: var(--pane); color: var(--text-2); font-size: 12px; }

  .node-label { font-size: 10px; fill: var(--text); pointer-events: none; paint-order: stroke; stroke: #fff; stroke-width: 3px; }
  #tooltip { position: fixed; pointer-events: none; z-index: 10; background: var(--bg); border: 1px solid var(--border);
             border-radius: 4px; padding: 6px 8px; box-shadow: 0 2px 8px rgba(0,0,0,.12); display: none; font-size: 12px; }
  #tooltip b { display: block; }
  #loader { padding: 24px; }
  @media (max-width: 700px) {
    html, body { height: auto; min-height: 100%; }
    body { min-height: 100vh; }
    .app { display: block; flex: none; }
    nav { width: 100%; max-height: 38vh; overflow-y: auto; }
    main { min-height: 70vh; }
    .content { min-height: 65vh; }
    #view-network { flex-direction: column; min-height: 65vh; }
    #chart { min-height: 45vh; }
    #details { width: 100%; max-height: 20vh; border-left: 0; border-top: 1px solid var(--border); }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">Network Analysis of Causes of Death Across Countries</div>
  <input id="search" type="search" list="node-list" placeholder="Search cause or indicator">
  <datalist id="node-list"></datalist>
  <div class="switch" role="group" aria-label="Network">
    <button data-tab="glasso">Direct links</button>
    <button data-tab="correlation">Co-occurrence</button>
    <button data-tab="report">Report</button>
  </div>
</header>

<div class="app">
  <nav>
    <div class="nav-title">Communities</div>
    <div id="communities"></div>

    <div class="nav-title">Filters</div>
    <div class="filters">
      <label>Colour
        <select id="color-by"><option value="community">community</option><option value="category">WHO group</option></select>
      </label>
      <label><input type="checkbox" id="show-indicators"> indicators</label>
      <label>Indicator links
        <select id="link-sign"><option value="all">all</option><option value="-1">negative</option><option value="1">positive</option></select>
      </label>
      <div class="row"><span>Min. link</span><span id="min-weight-value">0.00</span></div>
      <input type="range" id="min-weight" min="0" max="1" step="0.01" value="0">
      <label><input type="checkbox" id="show-labels"> labels</label>
      <div><button class="small-btn" id="reset">Reset</button></div>
    </div>
  </nav>

  <main>
    <div class="toolbar">
      <button class="on" data-view="network">Graph</button>
      <button data-view="nodes">Nodes<span class="count" id="count-nodes"></span></button>
      <button data-view="links">Links<span class="count" id="count-links"></span></button>
    </div>
    <div class="content">
    <section class="view" id="view-network">
      <div id="chart"></div>
      <aside id="details"><p class="empty">No node selected</p></aside>
    </section>
    <section class="view" id="view-nodes" hidden><div class="table-wrap"><table id="nodes-table"></table></div></section>
    <section class="view" id="view-links" hidden><div class="table-wrap"><table id="links-table"></table></div></section>
    </div>
    <section id="view-report"><iframe id="report-frame" title="Report"></iframe></section>
    <div id="loader" hidden>
      <p>Network files not found. Select network_glasso.json and network_correlation.json:</p>
      <input type="file" id="file-input" accept=".json" multiple>
    </div>
  </main>
</div>

<footer class="status" id="status"></footer>
<div id="tooltip"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
// Config +++
const DATA_FILES = { glasso: "network_glasso.json", correlation: "network_correlation.json" };  // from network_builder.py
const DEFAULT_METHOD = "glasso";
const REPORT_FILE = "report.pdf";

const METHOD_NAMES = { glasso: "Direct links", correlation: "Co-occurrence" };
const COMMUNITY_NAMES = {
  glasso: {
    1: "Cancers", 2: "Low-mortality", 3: "Mixed chronic", 4: "Maternal & tropical", 5: "Infections & digestive",
    6: "Malnutrition & diarrhoea", 7: "Heart & injuries", 8: "Alcohol & liver", 9: "Vaccine-preventable & TB",
    10: "HIV & violence", 11: "Drug use & head-neck cancer",
  },
  correlation: {
    1: "Vaccine-preventable & basic care", 2: "Tropical & poverty", 3: "Cancers", 4: "Low-mortality",
    5: "Alcohol", 6: "Liver cancers",
  },
};
const COLORS = ["#1f77b4", "#ff7f0e", "#2ca02c", "#d62728", "#9467bd", "#8c564b",
                "#e377c2", "#17becf", "#bcbd22", "#393b79", "#7b4173", "#e7ba52"];   // one colour per community
const NO_COMMUNITY = "#c8c8c8";
const CATEGORY_NAMES = { communicable: "Communicable", noncommunicable: "Noncommunicable", injuries: "Injuries" };
// Config ---

const networks = {};
let method = DEFAULT_METHOD, selectedId = null, currentUpdate = () => {};
const $ = id => document.getElementById(id);
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const fmt = (v, d = 2) => (v === null || v === undefined || Number.isNaN(+v)) ? "–" : (+v).toFixed(d);
const communityName = c => c > 0 ? ((COMMUNITY_NAMES[method] || {})[c] || `Community ${c}`) : "No community";
const communityColor = c => c > 0 ? COLORS[(c - 1) % COLORS.length] : NO_COMMUNITY;

// ---- loading -----------------------------------------------------------------------------------
Promise.all(Object.entries(DATA_FILES).map(([m, file]) =>
  fetch(file).then(r => r.ok ? r.json() : null).catch(() => null).then(d => { if (d) networks[m] = d; })))
  .then(start);

$("file-input").onchange = e => Promise.all([...e.target.files].map(f => f.text().then(t => {
  const d = JSON.parse(t); networks[d.meta.method] = d;
}))).then(start);

function start() {
  const ok = Object.keys(networks).length > 0;
  $("loader").hidden = ok;
  document.querySelector(".content").hidden = !ok;
  if (!ok) return;
  if (!networks[method]) method = Object.keys(networks)[0];
  showNetwork(method);
}

let drawn = null;   // network currently drawn
function setTab(tab) {
  document.querySelectorAll(".switch button").forEach(b => {
    b.classList.toggle("on", b.dataset.tab === tab);
    if (b.dataset.tab !== "report") b.disabled = !networks[b.dataset.tab];
  });
  document.body.classList.toggle("report-mode", tab === "report");
}
function showNetwork(m) {
  method = m;
  setTab(m);
  if (drawn !== m) { drawn = m; draw(networks[m]); }
}
function showReport() {
  setTab("report");
  if (!$("report-frame").src) $("report-frame").src = REPORT_FILE;
}
document.querySelectorAll(".switch button").forEach(b => b.onclick = () => {
  if (b.dataset.tab === "report") showReport();
  else if (networks[b.dataset.tab]) showNetwork(b.dataset.tab);
});

// ---- views -------------------------------------------------------------------------------------
function showView(name) {
  document.querySelectorAll(".toolbar button").forEach(b => b.classList.toggle("on", b.dataset.view === name));
  ["network", "nodes", "links"].forEach(v => $(`view-${v}`).hidden = v !== name);
}
document.querySelectorAll(".toolbar button").forEach(b => b.onclick = () => showView(b.dataset.view));

// sortable table: columns = [{key, label, num, digits}]
function renderTable(table, columns, rows, onClick) {
  let sortKey = null, asc = true;
  function paint() {
    const sorted = sortKey === null ? rows : [...rows].sort((a, b) =>
      (a[sortKey] > b[sortKey] ? 1 : a[sortKey] < b[sortKey] ? -1 : 0) * (asc ? 1 : -1));
    table.innerHTML = `<thead><tr>${columns.map(c => `<th class="${c.num ? "num" : ""}" data-key="${c.key}">${c.label}${
      c.key === sortKey ? (asc ? " ▲" : " ▼") : ""}</th>`).join("")}</tr></thead><tbody>${
      sorted.map((r, i) => `<tr data-i="${rows.indexOf(r)}">${columns.map(c => `<td class="${c.num ? "num" : ""}">${
        c.html ? c.html(r) : c.num ? fmt(r[c.key], c.digits ?? 2) : r[c.key]}</td>`).join("")}</tr>`).join("")}</tbody>`;
    table.querySelectorAll("th").forEach(th => th.onclick = () => {
      const k = th.dataset.key; asc = sortKey === k ? !asc : !columns.find(c => c.key === k).num; sortKey = k; paint();
    });
    if (onClick) table.querySelectorAll("tbody tr").forEach(tr => tr.onclick = () => onClick(rows[+tr.dataset.i]));
  }
  paint();
}

// ---- drawing -----------------------------------------------------------------------------------
function draw(data) {
  const nodes = data.nodes.map(d => ({ ...d }));
  const links = data.links.map(d => ({ ...d, sign: d.type === "indicator-cause" ? Math.sign(d.rho) : 1 }));
  const byId = new Map(nodes.map(d => [d.id, d]));
  const neighbours = new Map(nodes.map(d => [d.id, []]));
  links.forEach(l => {
    neighbours.get(l.source).push({ id: l.target, rho: l.rho, type: l.type });
    neighbours.get(l.target).push({ id: l.source, rho: l.rho, type: l.type });
  });
  const causes = nodes.filter(d => d.type === "cause");
  const communities = [...new Set(causes.map(d => d.community))].sort((a, b) => a - b);
  const active = new Set([...communities, 0]);
  let selected = null;

  // status bar and counts
  const nCause = links.filter(l => l.type === "cause-cause").length;
  $("status").innerHTML = [METHOD_NAMES[method], `${causes.length} causes`, `${nodes.length - causes.length} indicators`,
    `${nCause} cause links`, `${links.length - nCause} indicator links`, `${communities.filter(c => c > 0).length} communities`,
    `threshold ${data.meta.threshold}`, `indicator threshold ${data.meta.indicator_threshold}`, `control: ${data.meta.control}`]
    .map(t => `<span>${t}</span>`).join("");
  $("count-nodes").textContent = nodes.length;
  $("count-links").textContent = links.length;

  // slider range follows the data
  const slider = $("min-weight");
  slider.min = Math.floor(d3.min(links, l => l.weight) * 100) / 100;
  slider.max = Math.ceil(d3.max(links, l => l.weight) * 100) / 100;
  slider.value = slider.min;
  $("min-weight-value").textContent = (+slider.min).toFixed(2);
  const maxOfType = t => d3.max(links, l => l.type === t ? l.weight : 0) || 1;
  const maxW = { "cause-cause": maxOfType("cause-cause"), "indicator-cause": maxOfType("indicator-cause") };
  const relWeight = l => l.weight / maxW[l.type];

  // colours
  const categories = Object.keys(CATEGORY_NAMES);
  function nodeColor(d) {
    if (d.type === "indicator") return css("--indicator");
    if ($("color-by").value === "category") return COLORS[categories.indexOf(d.category)] || NO_COMMUNITY;
    return communityColor(d.community);
  }
  const linkColor = l => l.type === "cause-cause" ? css("--link") : (l.sign < 0 ? css("--protective") : css("--harmful"));

  // layout: communities on a circle, nodes pulled towards their community
  const chart = $("chart");
  chart.innerHTML = "";
  const area = document.querySelector(".content");   // the graph may be hidden behind a table view
  const width = chart.clientWidth || Math.max(area.clientWidth - 320, 600), height = chart.clientHeight || area.clientHeight || 600;
  const centers = new Map();
  const real = communities.filter(c => c > 0);
  real.forEach((c, i) => {
    const a = (i / real.length) * 2 * Math.PI - Math.PI / 2, r = Math.min(width, height) * 0.3;
    centers.set(c, [width / 2 + r * Math.cos(a), height / 2 + r * Math.sin(a)]);
  });
  centers.set(0, [width / 2, height / 2]);
  const size = d3.scaleSqrt().domain([0, d3.max(causes, d => d.median_rate)]).range([3, 15]);
  const radius = d => d.type === "cause" ? size(d.median_rate) : 4.5;

  const simulation = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(d => d.id).strength(l => relWeight(l) * (l.type === "cause-cause" ? 0.08 : 0.02)))
    .force("charge", d3.forceManyBody().strength(-45))
    .force("x", d3.forceX(d => (centers.get(d.community) || centers.get(0))[0]).strength(0.12))
    .force("y", d3.forceY(d => (centers.get(d.community) || centers.get(0))[1]).strength(0.12))
    .force("collide", d3.forceCollide(d => radius(d) + 2))
    .stop();
  for (let i = 0; i < 400; i++) simulation.tick();

  const svg = d3.select(chart).append("svg").attr("viewBox", [0, 0, width, height]);
  const root = svg.append("g");
  const zoom = d3.zoom().scaleExtent([0.3, 6]).on("zoom", e => root.attr("transform", e.transform));
  svg.call(zoom).on("click", e => { if (e.target === svg.node()) select(null); });

  const linkSel = root.append("g").selectAll("line").data(links).join("line")
    .attr("stroke-width", l => 0.5 + relWeight(l) * 2.5)
    .attr("stroke-dasharray", l => l.type === "indicator-cause" ? "4 2" : null);
  const nodeSel = root.append("g").selectAll("g").data(nodes).join("g").style("cursor", "pointer")
    .call(d3.drag()
      .on("start", (e, d) => { if (!e.active) simulation.alphaTarget(0.2).restart(); d.fx = d.x; d.fy = d.y; })
      .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
      .on("end", (e, d) => { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }));
  nodeSel.filter(d => d.type === "cause").append("circle").attr("r", radius);
  nodeSel.filter(d => d.type === "indicator").append("rect").attr("x", -4.5).attr("y", -4.5).attr("width", 9).attr("height", 9);
  nodeSel.selectAll("circle, rect").attr("stroke", "#fff").attr("stroke-width", 1.2);
  const labelSel = root.append("g").selectAll("text").data(nodes).join("text")
    .attr("class", "node-label").attr("dx", d => radius(d) + 3).attr("dy", 3).text(d => d.label);

  function render() {
    linkSel.attr("x1", l => l.source.x).attr("y1", l => l.source.y).attr("x2", l => l.target.x).attr("y2", l => l.target.y);
    nodeSel.attr("transform", d => `translate(${d.x},${d.y})`);
    labelSel.attr("x", d => d.x).attr("y", d => d.y);
  }
  simulation.on("tick", render);
  render();

  function fitView(duration = 0) {
    const shown = nodes.filter(isVisible);
    if (!shown.length) return;
    const [x0, x1] = d3.extent(shown, d => d.x), [y0, y1] = d3.extent(shown, d => d.y);
    const k = Math.min(4, 0.92 / Math.max((x1 - x0 + 60) / width, (y1 - y0 + 60) / height));
    const t = d3.zoomIdentity.translate(width / 2, height / 2).scale(k).translate(-(x0 + x1) / 2, -(y0 + y1) / 2);
    (duration ? svg.transition().duration(duration) : svg).call(zoom.transform, t);
  }

  // tooltip
  const tooltip = $("tooltip");
  nodeSel
    .on("mouseenter", (e, d) => {
      highlight(d);
      tooltip.innerHTML = `<b>${d.label}</b>` + (d.type === "cause"
        ? `${communityName(d.community)}<br>${fmt(d.median_rate, 1)} per 100k · ${d.degree} links`
        : `indicator · ${d.degree} links`);
      tooltip.style.display = "block";
    })
    .on("mousemove", e => {
      tooltip.style.left = Math.min(e.clientX + 12, innerWidth - tooltip.offsetWidth - 8) + "px";
      tooltip.style.top = Math.min(e.clientY + 12, innerHeight - tooltip.offsetHeight - 8) + "px";
    })
    .on("mouseleave", () => { tooltip.style.display = "none"; highlight(selected); })
    .on("click", (e, d) => { e.stopPropagation(); select(d); });

  // filters
  const isVisible = d => active.has(d.community) && (d.type === "cause" || $("show-indicators").checked);
  function linkVisible(l) {
    if (!isVisible(l.source) || !isVisible(l.target)) return false;
    if (l.weight < +slider.value - 1e-9) return false;
    const sign = $("link-sign").value;
    return !(l.type === "indicator-cause" && sign !== "all" && l.sign !== +sign);
  }
  function update() {
    nodeSel.style("display", d => isVisible(d) ? null : "none");
    nodeSel.selectAll("circle, rect").attr("fill", nodeColor);
    linkSel.style("display", l => linkVisible(l) ? null : "none").attr("stroke", linkColor);
    labelSel.style("display", d => ($("show-labels").checked && isVisible(d)) ? null : "none");
    drawCommunities();
    highlight(selected);
  }
  function highlight(d) {
    if (!d) {
      nodeSel.attr("opacity", 1); labelSel.attr("opacity", 1);
      linkSel.attr("stroke-opacity", l => l.type === "cause-cause" ? 0.6 : 0.5);
      return;
    }
    const near = new Set([d.id, ...neighbours.get(d.id).map(n => n.id)]);
    nodeSel.attr("opacity", n => near.has(n.id) ? 1 : 0.12);
    labelSel.attr("opacity", n => near.has(n.id) ? 1 : 0.12);
    linkSel.attr("stroke-opacity", l => (l.source.id === d.id || l.target.id === d.id) ? 0.9 : 0.03);
  }

  // details pane
  function select(d) {
    selected = d; selectedId = d ? d.id : null;
    highlight(d);
    const pane = $("details");
    if (!d) { pane.innerHTML = `<p class="empty">No node selected</p>`; return; }
    const list = neighbours.get(d.id).map(n => ({ ...n, node: byId.get(n.id) })).sort((a, b) => Math.abs(b.rho) - Math.abs(a.rho));
    const kv = d.type === "cause"
      ? [["WHO group", CATEGORY_NAMES[d.category] || d.category], ["Death rate (median)", fmt(d.median_rate, 2)],
         ["Links", d.degree], ["Strength", fmt(d.strength)], ["Betweenness", fmt(d.betweenness, 3)],
         ["Stability", d.community > 0 ? fmt(d.stability) : "–"]]
      : [["Group", String(d.category).replace("_", " ")], ["Links", d.degree]];
    pane.innerHTML = `<h2>${d.label}</h2>
      <div class="sub">${d.type === "cause" ? `<span class="dot" style="background:${communityColor(d.community)}"></span>${communityName(d.community)}` : "Indicator"}</div>
      <div class="kv">${kv.map(([k, v]) => `<span>${k}</span><span>${v}</span>`).join("")}</div>
      ${list.length ? `<table><thead><tr><th>Linked to</th><th class="num">${d.type === "cause" ? "Value" : "ρ"}</th></tr></thead><tbody>${
        list.map(n => `<tr data-id="${n.id}"><td>${n.node.label}${n.node.type === "indicator" ? " ▪" : ""}</td><td class="num">${
          n.rho > 0 ? "+" : "−"}${Math.abs(n.rho).toFixed(2)}</td></tr>`).join("")}</tbody></table>` : `<p class="empty">No links</p>`}`;
    pane.querySelectorAll("tbody tr").forEach(tr => tr.onclick = () => focusNode(byId.get(tr.dataset.id)));
  }
  function focusNode(d) {
    active.add(d.community);
    if (d.type === "indicator") $("show-indicators").checked = true;
    showView("network"); update(); select(d);
    svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity.translate(width / 2, height / 2).scale(2.2).translate(-d.x, -d.y));
  }

  // communities in the left pane: click to show / hide
  function drawCommunities() {
    const box = $("communities");
    box.innerHTML = "";
    communities.forEach(c => {
      const count = causes.filter(d => d.community === c).length;
      const item = document.createElement("button");
      item.className = "nav-item" + (active.has(c) ? "" : " off");
      item.innerHTML = `<span class="dot" style="background:${communityColor(c)}"></span>${c > 0 ? c + " " : ""}${communityName(c)}<span class="count">${count}</span>`;
      item.onclick = () => { active.has(c) ? active.delete(c) : active.add(c); update(); };
      box.appendChild(item);
    });
  }

  // tables
  renderTable($("nodes-table"), [
    { key: "label", label: "Name" }, { key: "type", label: "Type" },
    { key: "community", label: "Community", html: r => r.type === "cause" ? `<span class="dot" style="display:inline-block;margin-right:6px;background:${communityColor(r.community)}"></span>${communityName(r.community)}` : "–" },
    { key: "group", label: "Group" },
    { key: "median_rate", label: "Death rate", num: true }, { key: "degree", label: "Links", num: true, digits: 0 },
    { key: "strength", label: "Strength", num: true }, { key: "betweenness", label: "Betweenness", num: true, digits: 3 },
    { key: "stability", label: "Stability", num: true },
  ], nodes.map(d => d.type === "cause"
    ? { ...d, group: CATEGORY_NAMES[d.category] || d.category }
    : { ...d, group: String(d.category).replace(/_/g, " "), median_rate: null, strength: null, betweenness: null, stability: null }),
  r => focusNode(byId.get(r.id)));
  const linkRows = links.map(l => ({ a: l.source.label, b: l.target.label, type: l.type, weight: l.weight, rho: l.rho, node: l.source }));
  renderTable($("links-table"), [
    { key: "a", label: "Source" }, { key: "b", label: "Target" }, { key: "type", label: "Type" },
    { key: "weight", label: "Weight", num: true, digits: 3 }, { key: "rho", label: "Value", num: true, digits: 3 },
  ], linkRows, r => focusNode(r.node));

  // search
  $("node-list").innerHTML = nodes.map(d => `<option value="${d.label}">`).join("");
  $("search").onchange = e => {
    const d = nodes.find(n => n.label.toLowerCase() === e.target.value.trim().toLowerCase());
    if (d) focusNode(d);
  };

  // controls (on-properties: switching networks replaces the handlers)
  ["color-by", "show-indicators", "link-sign", "show-labels"].forEach(id => $(id).onchange = update);
  slider.oninput = () => { $("min-weight-value").textContent = (+slider.value).toFixed(2); update(); };
  $("reset").onclick = () => {
    communities.forEach(c => active.add(c));
    $("color-by").value = "community"; $("show-indicators").checked = false; $("link-sign").value = "all";
    slider.value = slider.min; $("min-weight-value").textContent = (+slider.min).toFixed(2);
    $("show-labels").checked = false; $("search").value = "";
    select(null); update(); fitView(400);
  };

  currentUpdate = update;
  update();
  fitView();
  if (selectedId && byId.has(selectedId)) select(byId.get(selectedId)); else select(null);
}
</script>
</body>
</html>
